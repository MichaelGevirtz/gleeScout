<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #FFFDFB; --surface: #FFFFFF; --ink: #241512; --ink-soft: #8A7A76; --ink-faint: #BDB1AD;
      --border: #F0E6E1; --coral: #E8622E; --coral-dark: #C94F21; --coral-tint: #FFEDE3;
      --mint: #6FA88A; --mint-tint: #E7F5EE; --mint-dark: #3E6B54;
      --shadow-card: 0 8px 24px rgba(36,21,18,0.08); --shadow-sheet: 0 -12px 32px rgba(36,21,18,0.18);
    }
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--bg); }
    a { color: var(--coral); } a:hover { color: var(--coral-dark); }
    h1, h2, h3 { font-family: 'Sora', system-ui, sans-serif; margin: 0; }
    .frame { position: relative; width: 390px; height: 844px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
    .known-chip { display: flex; align-items: center; gap: 6px; background: var(--mint-tint); border-radius: 999px; padding: 8px 13px; white-space: nowrap; }
    .ghost-chip { display: flex; align-items: center; gap: 6px; border: 1px dashed var(--border); border-radius: 999px; padding: 8px 13px; white-space: nowrap; color: var(--ink-faint); }
  </style>
</helmet>

<div class="frame">

  <!-- dimmed sliver of the chat, still visible behind the sheet -->
  <div style="position:relative;height:112px;padding:20px 20px 0;filter:blur(1.5px);opacity:0.55;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:34px;height:34px;border-radius:999px;background:var(--coral-tint);flex-shrink:0;"></div>
      <div style="font-size:14px;font-weight:700;">GleeScout</div>
    </div>
    <div style="margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:16px;border-top-left-radius:6px;padding:10px 14px;max-width:75%;font-size:12.5px;color:var(--ink-soft);">Perfect, noted! Last thing &mdash; roughly what's your budget&hellip;</div>
  </div>
  <div style="position:absolute;top:0;left:0;right:0;height:112px;background:rgba(36,21,18,0.28);"></div>

  <!-- the sheet -->
  <div style="position:relative;flex:1;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:var(--shadow-sheet);padding:12px 22px 26px;display:flex;flex-direction:column;">
    <div style="width:38px;height:4px;border-radius:999px;background:var(--border);margin:0 auto 18px;"></div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C94F21" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"></path></svg>
      <h2 style="font-size:19px;font-weight:700;">What I know so far</h2>
    </div>
    <p style="margin:0 0 20px 28px;font-size:13px;color:var(--ink-soft);">I'll keep filling this in as we chat.</p>

    <div style="display:flex;flex-wrap:wrap;gap:9px;">
      <div class="known-chip">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3E6B54" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="2"></rect><path d="M3 13h18"></path><path d="M12 9v12"></path><path d="M12 9c-1.5-4-6-4-6-1 0 1.7 2 1 6 1z"></path><path d="M12 9c1.5-4 6-4 6-1 0 1.7-2 1-6 1z"></path></svg>
        <span style="font-size:13px;font-weight:600;color:var(--mint-dark);">Outdoor bounce house</span>
      </div>
      <div class="known-chip">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3E6B54" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"></path><circle cx="12" cy="10" r="2.2"></circle></svg>
        <span style="font-size:13px;font-weight:600;color:var(--mint-dark);">Austin, TX</span>
      </div>
      <div class="known-chip">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3E6B54" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"></circle><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"></path><circle cx="17" cy="9" r="2.4"></circle><path d="M15 14c2.8.4 5 2.3 5 6"></path></svg>
        <span style="font-size:13px;font-weight:600;color:var(--mint-dark);">~30 kids</span>
      </div>
      <div class="known-chip">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3E6B54" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><line x1="16" y1="3" x2="16" y2="7"></line><line x1="8" y1="3" x2="8" y2="7"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span style="font-size:13px;font-weight:600;color:var(--mint-dark);">Sat, Jun 15 &middot; 2&ndash;4pm</span>
      </div>
    </div>

    <p style="font-size:12px;font-weight:600;letter-spacing:0.03em;color:var(--ink-faint);margin:24px 0 10px;">Nice to know, if it comes up</p>
    <div style="display:flex;flex-wrap:wrap;gap:9px;">
      <div class="ghost-chip">
        <span style="font-size:13px;">Theme preference</span>
      </div>
      <div class="ghost-chip">
        <span style="font-size:13px;">Water slide?</span>
      </div>
    </div>

    <div style="flex:1;"></div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:12px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#BDB1AD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      <span style="font-size:12px;color:var(--ink-faint);">Tap anywhere to keep chatting</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
