<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #FFFDFB; --surface: #FFFFFF; --ink: #241512; --ink-soft: #8A7A76; --ink-faint: #BDB1AD;
      --border: #F0E6E1; --coral: #E8622E; --coral-dark: #C94F21; --coral-tint: #FFEDE3;
      --mint: #6FA88A; --mint-tint: #E7F5EE; --mint-dark: #3E6B54; --yellow: #FFD966; --purple: #9B7FD4; --purple-tint: #F1EBFC;
      --amber-tint: #FFF6E0; --radius-pill: 999px; --radius-card: 18px; --radius-input: 16px;
      --shadow-card: 0 8px 24px rgba(36,21,18,0.08); --shadow-soft: 0 2px 10px rgba(36,21,18,0.06);
    }
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--bg); }
    a { color: var(--coral); } a:hover { color: var(--coral-dark); }
    h1, h2, h3 { font-family: 'Sora', system-ui, sans-serif; margin: 0; }
    .frame { position: relative; width: 390px; height: 844px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
    .blob-yellow { position: absolute; width: 220px; height: 220px; border-radius: 50%; background: var(--yellow); opacity: 0.14; bottom: -90px; left: -90px; z-index: 0; }
    .smart-bar { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-input); padding: 13px 16px; box-shadow: var(--shadow-soft); }
  </style>
</helmet>

<div class="frame">
  <div class="blob-yellow"></div>

  <div style="position:relative;z-index:1;padding:20px 20px 4px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <h1 style="font-size:20px;font-weight:700;">Your shortlist</h1>
      <div style="width:36px;height:36px;border-radius:999px;background:var(--coral-tint);display:flex;align-items:center;justify-content:center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#C94F21" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"></path></svg>
      </div>
    </div>

    <div class="smart-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#BDB1AD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
      <span style="flex:1;font-size:14.5px;color:var(--ink-faint);">Describe your event &mdash; I'll start comparing providers as we go</span>
    </div>
  </div>

  <div style="position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 40px;text-align:center;gap:12px;">
    <div style="width:72px;height:72px;border-radius:999px;background:var(--coral-tint);display:flex;align-items:center;justify-content:center;margin-bottom:6px;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#C94F21" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="2"></rect><path d="M3 13h18"></path><path d="M12 9v12"></path><path d="M12 9c-1.5-4-6-4-6-1 0 1.7 2 1 6 1z"></path><path d="M12 9c1.5-4 6-4 6-1 0 1.7-2 1-6 1z"></path></svg>
    </div>
    <h2 style="font-size:17px;font-weight:700;line-height:1.4;">Your shortlist will build here</h2>
    <p style="font-size:13.5px;color:var(--ink-soft);line-height:1.55;max-width:260px;margin:0;">Tell me what you're planning up above, and I'll start comparing real providers live as we go &mdash; no need to fill anything out first.</p>
  </div>
</div>
</x-dc>
</body>
</html>
