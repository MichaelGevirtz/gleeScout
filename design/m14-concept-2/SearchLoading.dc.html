<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #FFFDFB; --surface: #FFFFFF; --ink: #241512; --ink-soft: #8A7A76; --ink-faint: #BDB1AD;
      --border: #F0E6E1; --coral: #E8622E; --coral-dark: #C94F21; --coral-tint: #FFEDE3;
      --mint-tint: #E7F5EE; --mint-dark: #3E6B54; --shadow-soft: 0 2px 10px rgba(36,21,18,0.06); --radius-input: 16px;
    }
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--bg); }
    h1, h2, h3 { font-family: 'Sora', system-ui, sans-serif; margin: 0; }
    .frame { position: relative; width: 390px; height: 844px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
    .smart-bar { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-input); padding: 12px 16px; box-shadow: var(--shadow-soft); }
    .mini-chip { display: inline-flex; align-items: center; gap: 5px; background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 4px 9px; white-space: nowrap; }
    .skeleton-row { height: 76px; border-radius: 16px; background: linear-gradient(90deg, #F3ECE8 0%, #FBF6F3 50%, #F3ECE8 100%); margin-bottom: 10px; }
    .step-pill { display: flex; align-items: center; gap: 6px; }
  </style>
</helmet>

<div class="frame">
  <div style="padding:20px 20px 4px;">
    <h1 style="font-size:20px;font-weight:700;margin-bottom:14px;">Your shortlist</h1>
    <div class="smart-bar">
      <div style="width:15px;height:15px;border-radius:999px;border:2.5px solid var(--coral-tint);border-top-color:var(--coral);flex-shrink:0;"></div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;flex:1;">
        <div class="mini-chip"><span style="font-size:10.5px;font-weight:600;">Outdoor bounce house</span></div>
        <div class="mini-chip"><span style="font-size:10.5px;font-weight:600;">Austin, TX</span></div>
        <div class="mini-chip"><span style="font-size:10.5px;font-weight:600;">Jun 15</span></div>
      </div>
    </div>
  </div>

  <div style="padding:16px 20px 6px;">
    <div style="background:var(--coral-tint);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;">
      <div class="step-pill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3E6B54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span style="font-size:12.5px;font-weight:600;color:var(--ink-soft);text-decoration:line-through;">Searching the web</span>
      </div>
      <div class="step-pill">
        <div style="width:14px;height:14px;border-radius:999px;border:2px solid #fff;border-top-color:var(--coral);flex-shrink:0;"></div>
        <span style="font-size:12.5px;font-weight:700;color:var(--coral-dark);">Checking reviews &amp; reputation</span>
      </div>
      <div class="step-pill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D9C4B8" stroke-width="2.6"><circle cx="12" cy="12" r="9"></circle></svg>
        <span style="font-size:12.5px;color:var(--ink-faint);">Ranking your best matches</span>
      </div>
    </div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:14px 20px;">
    <div class="skeleton-row" style="opacity:0.85;"></div>
    <div class="skeleton-row" style="opacity:0.65;"></div>
    <div class="skeleton-row" style="opacity:0.45;"></div>
    <div class="skeleton-row" style="opacity:0.28;"></div>
  </div>
</div>
</x-dc>
</body>
</html>
