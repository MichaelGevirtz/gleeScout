<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #FFFDFB; --surface: #FFFFFF; --ink: #241512; --ink-soft: #8A7A76; --ink-faint: #BDB1AD;
      --border: #F0E6E1; --coral: #E8622E; --coral-dark: #C94F21; --coral-tint: #FFEDE3;
      --shadow-card: 0 8px 24px rgba(36,21,18,0.08); --shadow-soft: 0 2px 10px rgba(36,21,18,0.06); --radius-input: 16px;
    }
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--bg); }
    h1, h2, h3 { font-family: 'Sora', system-ui, sans-serif; margin: 0; }
    .frame { position: relative; width: 390px; height: 844px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
    .chat-pill { display: flex; align-items: center; gap: 9px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-input); padding: 11px 15px; box-shadow: var(--shadow-soft); }
  </style>
</helmet>

<div class="frame">
  <div style="padding:18px 20px 0;flex-shrink:0;">
    <div class="chat-pill">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A7A76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
      <span style="font-size:12.5px;font-weight:700;color:var(--ink-soft);">Chat</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#BDB1AD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-left:auto;"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 34px;text-align:center;gap:10px;">
    <div style="width:60px;height:60px;border-radius:999px;background:var(--coral-tint);display:flex;align-items:center;justify-content:center;margin-bottom:8px;">
      <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#C94F21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="13"></line><circle cx="12" cy="16.3" r="0.9" fill="#C94F21" stroke="none"></circle></svg>
    </div>
    <h2 style="font-size:18px;font-weight:700;line-height:1.35;">We couldn't finish building your matches</h2>
    <p style="font-size:13px;color:var(--ink-soft);line-height:1.55;margin:0;max-width:260px;">Something went wrong on our end &mdash; everything you've told us is safe. Try again in a moment.</p>
    <div style="margin-top:18px;background:var(--coral);color:#fff;text-align:center;border-radius:999px;padding:14px 28px;font-size:14px;font-weight:700;box-shadow:var(--shadow-card);">Try again</div>
  </div>
</div>
</x-dc>
</body>
</html>
