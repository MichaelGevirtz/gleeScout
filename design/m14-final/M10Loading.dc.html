<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #FFFDFB; --surface: #FFFFFF; --ink: #241512; --ink-soft: #8A7A76; --ink-faint: #BDB1AD;
      --border: #F0E6E1; --coral: #E8622E; --coral-dark: #C94F21; --coral-tint: #FFEDE3;
      --mint-tint: #E7F5EE; --shadow-sheet: 0 -12px 32px rgba(36,21,18,0.18);
    }
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--bg); }
    h1, h2, h3 { font-family: 'Sora', system-ui, sans-serif; margin: 0; }
    .frame { position: relative; width: 390px; height: 844px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
    .step { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
    .step-icon { width: 26px; height: 26px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  </style>
</helmet>

<div class="frame">

  <div style="position:relative;height:120px;padding:18px 20px 0;filter:blur(1.5px);opacity:0.5;">
    <div style="display:flex;align-items:center;gap:9px;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:11px 15px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A7A76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
      <span style="font-size:12.5px;font-weight:700;color:var(--ink-soft);">Chat</span>
    </div>
    <h1 style="font-size:17px;font-weight:700;margin-top:14px;">These are your best matches</h1>
  </div>
  <div style="position:absolute;top:0;left:0;right:0;height:120px;background:rgba(36,21,18,0.28);"></div>

  <div style="position:relative;flex:1;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow-sheet);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 30px;">
    <div style="width:38px;height:4px;border-radius:999px;background:var(--border);position:absolute;top:12px;"></div>

    <div style="width:60px;height:60px;border-radius:999px;border:4px solid var(--coral-tint);border-top-color:var(--coral);margin-bottom:22px;"></div>

    <span style="font-size:12px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--coral);">Sandi's Moonwalks</span>
    <h2 style="font-size:19px;font-weight:700;line-height:1.35;margin-top:6px;text-align:center;">Getting this provider ready for you</h2>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:8px;text-align:center;max-width:250px;line-height:1.5;">We're preparing questions to ask on your behalf &mdash; we haven't contacted them yet.</p>

    <div style="text-align:left;margin-top:20px;width:100%;max-width:260px;">
      <div class="step">
        <div class="step-icon" style="background:var(--mint-tint);">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3E6B54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <span style="font-size:13px;color:var(--ink-soft);text-decoration:line-through;">Checking what we already know</span>
      </div>
      <div class="step">
        <div class="step-icon" style="background:var(--coral-tint);">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#E8622E" stroke-width="3"><circle cx="12" cy="12" r="9"></circle></svg>
        </div>
        <span style="font-size:13px;font-weight:600;">Figuring out what's still unclear</span>
      </div>
      <div class="step">
        <div class="step-icon" style="background:var(--bg);border:1px solid var(--border);">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#BDB1AD" stroke-width="3"><circle cx="12" cy="12" r="9"></circle></svg>
        </div>
        <span style="font-size:13px;color:var(--ink-faint);">Preparing simulated answers</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
