<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #FFFDFB; --surface: #FFFFFF; --ink: #241512; --ink-soft: #8A7A76; --ink-faint: #BDB1AD;
      --border: #F0E6E1; --coral: #E8622E; --coral-dark: #C94F21; --coral-tint: #FFEDE3; --mint-tint: #E7F5EE;
      --shadow-soft: 0 2px 10px rgba(36,21,18,0.06); --radius-input: 16px;
    }
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--bg); }
    h1, h2, h3 { font-family: 'Sora', system-ui, sans-serif; margin: 0; }
    .frame { position: relative; width: 390px; height: 844px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
    .chat-pill { display: flex; align-items: center; gap: 9px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-input); padding: 11px 15px; box-shadow: var(--shadow-soft); }
    .mini-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--coral-tint); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
    .skeleton-row { height: 74px; border-radius: 16px; background: linear-gradient(90deg, #F3ECE8 0%, #FBF6F3 50%, #F3ECE8 100%); margin-bottom: 10px; }
    .step { display: flex; align-items: center; gap: 8px; }
  </style>
</helmet>

<div class="frame">

  <div style="padding:18px 20px 0;flex-shrink:0;">
    <div class="chat-pill">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A7A76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
      <span style="font-size:12.5px;font-weight:700;color:var(--ink-soft);">Chat</span>
      <div style="display:flex;gap:5px;flex:1;overflow:hidden;">
        <div class="mini-chip"><span style="font-size:10px;font-weight:700;color:var(--coral-dark);">5 details noted</span></div>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#BDB1AD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 34px;text-align:center;">
    <div style="width:56px;height:56px;border-radius:999px;border:4px solid var(--coral-tint);border-top-color:var(--coral);margin-bottom:20px;"></div>
    <h2 style="font-size:19px;font-weight:700;line-height:1.35;">Great, I have what I need &mdash; finding your best matches</h2>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-top:8px;">Outdoor bounce house &middot; Austin, TX &middot; Jun 15 &middot; $200&ndash;400</p>

    <div style="text-align:left;margin-top:20px;width:100%;max-width:250px;">
      <div class="step" style="padding:6px 0;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3E6B54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span style="font-size:12.5px;color:var(--ink-soft);text-decoration:line-through;">Searching the web</span>
      </div>
      <div class="step" style="padding:6px 0;">
        <div style="width:13px;height:13px;border-radius:999px;border:2px solid var(--coral-tint);border-top-color:var(--coral);flex-shrink:0;"></div>
        <span style="font-size:12.5px;font-weight:700;color:var(--coral-dark);">Checking reviews &amp; reputation</span>
      </div>
      <div class="step" style="padding:6px 0;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#D9C4B8" stroke-width="2.6"><circle cx="12" cy="12" r="9"></circle></svg>
        <span style="font-size:12.5px;color:var(--ink-faint);">Ranking your best matches</span>
      </div>
    </div>
  </div>

  <div style="padding:0 20px 20px;flex-shrink:0;">
    <div class="skeleton-row" style="opacity:0.7;"></div>
    <div class="skeleton-row" style="opacity:0.4;margin-bottom:0;"></div>
  </div>
</div>
</x-dc>
</body>
</html>
